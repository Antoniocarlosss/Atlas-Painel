<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>

        </header>

        <main>
            <section id="grid-home" class="grid-container">
    <div class="card" onclick="abrirModulo('injecao')"><i class="fas fa-microchip"></i><span>Injeção</span></div>
    <div class="card" onclick="abrirModulo('bobines')"><i class="fas fa-compact-disc"></i><span>Bobines</span></div>

    <div class="card" onclick="abrirModulo('embalagem')"><i class="fas fa-boxes-packing"></i><span>Embalagem</span></div>
    <div id="card-gestao" class="card" onclick="abrirModulo('gestao')"><i class="fas fa-chart-line"></i><span>Gestão</span></div>
    <div class="card" onclick="abrirModulo('config')"><i class="fas fa-gears"></i><span>Ajustes</span></div>
    <div class="card" onclick="abrirModulo('plano')"><i class="fas fa-clipboard-list"></i><span>Plano</span></div>
    <div id="card-stock" class="card" onclick="abrirModulo('stock')"><i class="fas fa-boxes-stacked"></i><span>Stock</span></div>
    <div id="card-permissoes" class="card" onclick="abrirModulo('permissoes')"><i class="fas fa-user-shield"></i><span>Permissões</span></div>
    <div id="card-conferencia" class="card" onclick="abrirModulo('conferencia')">
    <i class="fas fa-clipboard-check"></i>
    <span>Conferência</span>
</div>
    <div id="card-lixeira-atlas" class="card" onclick="abrirModulo('lixeira')">

</div>

</section>
          <section id="conteudo-modulo" style="display:none;">
                <div class="modulo-header">
                    <button onclick="voltarHome()" class="btn-voltar-clean">
                        <i class="fas fa-arrow-left"></i> VOLTAR
                    </button>
                    <h2 id="titulo-modulo" style="font-size:16px;">MÓDULO</h2>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        window.ATLAS_SISTEMA_VERSAO = '20260503-aviso-atualizacao';
        window.ATLAS_SISTEMA_BUILD = 95;
        window.atlasMostrarTelaAtualizacao = function atlasMostrarTelaAtualizacao(opcoes = {}) {
            const finalizado = opcoes.finalizado === true;
            let overlay = document.getElementById('atlas-update-screen');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'atlas-update-screen';
                overlay.style.cssText = 'position:fixed; inset:0; z-index:50000; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at top,#17233a 0,#08111f 58%,#020617 100%); color:white; font-family:Inter,Arial,sans-serif;';
                overlay.innerHTML = `
                    <style>
                        @keyframes atlasLogoEntrando { from { opacity:0; transform:translateY(12px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
                        @keyframes atlasBarraUpdate { from { width:0%; } to { width:var(--atlas-progresso, 100%); } }
                        .atlas-update-card { width:min(92vw, 430px); border:1px solid #334155; background:rgba(15,23,42,.92); border-radius:18px; padding:28px; box-shadow:0 24px 80px rgba(0,0,0,.45); text-align:center; }
                        .atlas-update-logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:18px; animation:atlasLogoEntrando .7s ease both; }
                        .atlas-update-mark { width:42px; height:28px; position:relative; }
                        .atlas-update-mark::before, .atlas-update-mark::after { content:''; position:absolute; left:0; width:36px; height:9px; background:#ef1b2d; transform:skewX(-18deg); }
                        .atlas-update-mark::before { top:3px; }
                        .atlas-update-mark::after { bottom:3px; }
                        .atlas-update-name { font-size:32px; line-height:1; font-weight:900; letter-spacing:0; color:#fff; }
                        .atlas-update-name b { color:#ef1b2d; }
                        .atlas-update-sub { margin-top:3px; font-size:11px; letter-spacing:7px; color:#cbd5e1; font-weight:800; }
                        .atlas-update-status { font-size:18px; font-weight:900; margin:10px 0 6px; }
                        .atlas-update-detail { color:#a7bdd8; font-size:14px; margin-bottom:18px; }
                        .atlas-update-track { height:14px; border-radius:999px; overflow:hidden; background:#020617; border:1px solid #334155; }
                        .atlas-update-fill { height:100%; width:0%; background:linear-gradient(90deg,#2563eb,#10b981,#ef1b2d); transition:width .25s ease; }
                        .atlas-update-percent { margin-top:10px; color:#22c55e; font-weight:900; font-size:22px; }
                    </style>
                    <div class="atlas-update-card">
                        <div class="atlas-update-logo">
                            <div class="atlas-update-mark"></div>
                            <div>
                                <div class="atlas-update-name"><b>ATLAS</b> PAINEL</div>
                                <div class="atlas-update-sub">PAINEL</div>
                            </div>
                        </div>
                        <div class="atlas-update-status">${finalizado ? 'Sistema atualizado' : 'Atualizando sistema'}</div>
                        <div class="atlas-update-detail">${finalizado ? 'Tudo pronto para usar.' : 'Limpando cache antigo e baixando a nova versao.'}</div>
                        <div class="atlas-update-track"><div class="atlas-update-fill"></div></div>
                        <div class="atlas-update-percent">0%</div>
                    </div>
                `;
                document.documentElement.appendChild(overlay);
            }

            const fill = overlay.querySelector('.atlas-update-fill');
            const percent = overlay.querySelector('.atlas-update-percent');
            const status = overlay.querySelector('.atlas-update-status');
            const detail = overlay.querySelector('.atlas-update-detail');
            let valor = finalizado ? 82 : 0;
            const alvo = finalizado ? 100 : 94;
            if (status) status.textContent = finalizado ? 'Sistema atualizado' : 'Atualizando sistema';
            if (detail) detail.textContent = finalizado ? 'Tudo pronto para usar.' : 'Limpando cache antigo e baixando a nova versao.';

            const timer = setInterval(() => {
                valor = Math.min(alvo, valor + (finalizado ? 6 : Math.ceil(Math.random() * 8)));
                if (fill) fill.style.width = valor + '%';
                if (percent) percent.textContent = valor + '%';
                if (valor >= alvo) clearInterval(timer);
            }, 120);

            return overlay;
        };

        window.atlasExecutarAtualizacaoAparelho = function atlasExecutarAtualizacaoAparelho() {
            window.atlasMostrarTelaAtualizacao();
            const limparCaches = ('caches' in window)
                ? caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('atlas-')).map(key => caches.delete(key))))
                : Promise.resolve();
            const atualizarWorker = ('serviceWorker' in navigator)
                ? navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(reg => {
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    return reg.update().catch(() => null);
                })))
                : Promise.resolve();

            Promise.allSettled([limparCaches, atualizarWorker]).finally(() => {
                setTimeout(() => location.reload(), 900);
            });
        };

        window.atlasMostrarAvisoAtualizacaoDisponivel = function atlasMostrarAvisoAtualizacaoDisponivel(info = {}) {
            if (document.getElementById('atlas-update-notice')) return;
            const versao = info.versao || 'nova versao';
            const overlay = document.createElement('div');
            overlay.id = 'atlas-update-notice';
            overlay.style.cssText = 'position:fixed; inset:0; z-index:49999; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(2,6,23,.82); color:white; font-family:Inter,Arial,sans-serif;';
            overlay.innerHTML = `
                <div style="width:min(94vw,460px); background:#0f172a; border:1px solid #3b82f6; border-radius:18px; padding:24px; box-shadow:0 22px 70px rgba(0,0,0,.5); text-align:center;">
                    <div style="font-size:30px; font-weight:900; margin-bottom:6px;"><span style="color:#ef1b2d;">ATLAS</span> PAINEL</div>
                    <div style="font-size:20px; font-weight:900; margin-bottom:8px;">Atualizacao disponivel</div>
                    <div style="color:#bfdbfe; font-size:14px; margin-bottom:18px;">Existe uma versao nova do sistema: <b>${versao}</b>. Atualize para evitar erros de usuario, permissao e relatorios.</div>
                    <button onclick="window.atlasExecutarAtualizacaoAparelho()" style="width:100%; border:none; border-radius:12px; background:#10b981; color:white; padding:15px; font-weight:900; cursor:pointer;">ATUALIZAR AGORA</button>
                    <button onclick="document.getElementById('atlas-update-notice')?.remove()" style="width:100%; border:1px solid #334155; border-radius:12px; background:#1e293b; color:white; padding:12px; font-weight:900; cursor:pointer; margin-top:10px;">LEMBRAR DEPOIS</button>
                </div>
            `;
            document.documentElement.appendChild(overlay);
        };

        window.atlasChecarAvisoVersaoPublicada = function atlasChecarAvisoVersaoPublicada() {
            let info = null;
            try {
                info = JSON.parse(localStorage.getItem('atlas_versao_publicada_info') || 'null');
            } catch (erro) {
                info = null;
            }
            const buildPublicado = Number(info?.build || 0);
            const buildAtual = Number(window.ATLAS_SISTEMA_BUILD || 0);
            if (buildPublicado > buildAtual) {
                window.atlasMostrarAvisoAtualizacaoDisponivel(info);
            }
        };

        window.addEventListener('atlasVersaoPublicadaAtualizada', window.atlasChecarAvisoVersaoPublicada);
        window.addEventListener('load', () => setTimeout(window.atlasChecarAvisoVersaoPublicada, 2500));

        (function prepararAtualizacaoAtlas() {
            const chaveVersao = 'atlas_sistema_versao';
            const chaveAviso = 'atlas_sistema_mostrar_atualizado';
            const versaoSalva = localStorage.getItem(chaveVersao);
            const versaoAtual = window.ATLAS_SISTEMA_VERSAO;
            if (versaoSalva === versaoAtual) return;

            if (versaoSalva) window.atlasMostrarTelaAtualizacao();
            localStorage.setItem(chaveVersao, versaoAtual);
            localStorage.setItem(chaveAviso, '1');

            const limparCaches = ('caches' in window)
                ? caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('atlas-')).map(key => caches.delete(key))))
                : Promise.resolve();

            const atualizarWorker = ('serviceWorker' in navigator)
                ? navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(reg => reg.update().catch(() => null))))
                : Promise.resolve();

            Promise.allSettled([limparCaches, atualizarWorker]).finally(() => {
                if (versaoSalva) {
                    setTimeout(() => location.reload(), 1200);
                }
            });
        })();
    </script>
    <script src="script.js?v=20260503-aviso-atualizacao"></script>
    <script src="historicos-admin.js?v=20260427-lembretes-auditoria"></script>
    <script src="atlas-ajustes-fachadas.js?v=20260427-permissao-excluir"></script>
    <script type="module" src="firebase-atlas.js?v=20260503-aviso-atualizacao"></script>
    <script>
        if ('serviceWorker' in navigator) {
            let atlasAtualizandoPWA = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (atlasAtualizandoPWA) return;
                atlasAtualizandoPWA = true;
                window.location.reload();
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=20260503-aviso-atualizacao')
                    .then(reg => {
                        console.log('Atlas PWA: Ativo!');
                        reg.update();
                        if (reg.waiting) {
                            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                        reg.addEventListener('updatefound', () => {
                            const novoWorker = reg.installing;
                            if (!novoWorker) return;
                            novoWorker.addEventListener('statechange', () => {
                                if (novoWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    novoWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch(err => console.log('Erro PWA:', err));
            });
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('atlas_sistema_mostrar_atualizado') !== '1') return;
            localStorage.removeItem('atlas_sistema_mostrar_atualizado');

            const overlay = window.atlasMostrarTelaAtualizacao({ finalizado: true });
            setTimeout(() => overlay?.remove(), 2200);
        });
    </script>

    <div id="modal-edicao" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; padding:12px;">
        <div style="background:#1e293b; width:100%; max-width:920px; max-height:92vh; overflow:auto; padding:16px; border-radius:12px; border:1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h3 style="color:white; margin-top:0; border-bottom:1px solid #334155; padding-bottom:10px;">Editar Registro</h3>
            <div id="conteudo-modal" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;"></div>
            <div style="display:flex; gap:10px; margin-top:16px; position:sticky; bottom:0; background:#1e293b; padding-top:10px;">
                <button onclick="fecharModal()" style="flex:1; background:#475569; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">CANCELAR</button>
                <button onclick="salvarEdicaoModal()" style="flex:1; background:#10b981; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">SALVAR</button>
            </div>
